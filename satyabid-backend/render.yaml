services:
  - type: web
    name: satyabid-backend
    runtime: python
    pythonVersion: "3.11"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn api:app --workers 2 --bind 0.0.0.0:$PORT"
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: PORT
        value: "8000"
      - key: API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://satyabid.netlify.app"
